<text x="100" y="929" class="small" text-anchor="start">One tile T=512 cm. One build level H=384 cm. Floor top Z=0.</text>
<text x="800" y="145" class="head" text-anchor="start">THE LEARNING LOOP</text>
<text x="800" y="175" class="small" text-anchor="start">1. Watch the scenario reference.</text>
<text x="800" y="198" class="small" text-anchor="start">2. Copy in the blank neighboring cells.</text>
<text x="800" y="221" class="small" text-anchor="start">3. Recall with the model hidden.</text>
<text x="800" y="244" class="small" text-anchor="start">4. Apply the principle while moving.</text>
<text x="800" y="267" class="small" text-anchor="start">5. Repeat at your own speed.</text>
<text x="800" y="322" class="head" text-anchor="start">READABLE BY DESIGN</text>
<text x="800" y="352" class="small" text-anchor="start">Two choices beside hub spawn:</text>
<text x="800" y="375" class="small" text-anchor="start">START HERE or FREE BUILD.</text>
<text x="800" y="398" class="small" text-anchor="start">No rank gate for self-directed practice.</text>
<text x="800" y="421" class="small" text-anchor="start">Short hub return at the court entrance.</text>
<text x="800" y="444" class="small" text-anchor="start">Reference cells remain separate from copy cells.</text>
<text x="800" y="499" class="head" text-anchor="start">DIMENSION CONTRACT</text>
<text x="800" y="529" class="small" text-anchor="start">6 cm open-frame ghost edges.</text>
<text x="800" y="552" class="small" text-anchor="start">Wall: 512 × 384 cm.</text>
<text x="800" y="575" class="small" text-anchor="start">Floor: 512 × 512 cm.</text>
<text x="800" y="598" class="small" text-anchor="start">Ramp: 512 run / 384 rise / 640 slope.</text>
<text x="800" y="621" class="small" text-anchor="start">Bay gaps: 1 tile. Main cross-route: 2 tiles.</text>
<text x="800" y="676" class="head" text-anchor="start">VERIFICATION BOUNDARY</text>
<text x="800" y="706" class="small" text-anchor="start">Court is initially unscored visual practice.</text>
<text x="800" y="729" class="small" text-anchor="start">Position alone does not prove a build piece.</text>
<text x="800" y="752" class="small" text-anchor="start">Ghosts do not certify edits or accuracy.</text>
<text x="800" y="775" class="small" text-anchor="start">Movement, camera and resets need live tests.</text>
<text x="800" y="798" class="small" text-anchor="start">Measured learning gains need human playtests.</text>
