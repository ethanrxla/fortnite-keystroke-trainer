<text x="260" y="196" class="small" text-anchor="middle">10 × 10 tiles</text>
<text x="260" y="218" class="small" text-anchor="middle">51.20 × 51.20 m</text>
<text x="260" y="240" class="small" text-anchor="middle">Open sky; 8 levels clear</text>
<text x="580" y="174" class="head" text-anchor="middle">05 TRANSFER</text>
<text x="580" y="196" class="small" text-anchor="middle">10 × 10 tiles</text>
<text x="580" y="218" class="small" text-anchor="middle">Cover-to-cover practice</text>
<text x="580" y="240" class="small" text-anchor="middle">3-tile reset buffer at left</text>
<text x="212.0" y="529.2" class="head" text-anchor="middle">01 BUILD</text>
