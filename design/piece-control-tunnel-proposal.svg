<text x="80" y="580" class="head" text-anchor="start">Own box → covered advance → contested piece → react → safe shot or disengage</text>
<text x="80" y="612" class="small" text-anchor="start">T = 512 cm. H = 384 cm. Proposed active deck Z=H; catch surface Z=0; shell underside Z=4H.</text>
<text x="80" y="640" class="small" text-anchor="start">No permanent cage around B. With no learner builds, all declared escape routes must work.</text>
<text x="80" y="669" class="small" text-anchor="start">Diagram marks exercise zones; colored borders are not prebuilt walls or proof of ownership.</text>
<text x="840" y="181" class="head" text-anchor="start">THE PROGRESSION</text>
<text x="840" y="215" class="small" text-anchor="start">Learn / full reference</text>
<text x="840" y="245" class="small" text-anchor="start">Copy / help on request</text>
<text x="840" y="275" class="small" text-anchor="start">Recall / shape hidden</text>
<text x="840" y="305" class="small" text-anchor="start">React / one changed condition</text>
<text x="840" y="335" class="small" text-anchor="start">Transfer / unseen setup</text>
<text x="840" y="397" class="head" text-anchor="start">WHAT MUST BE REAL</text>
<text x="840" y="431" class="small" text-anchor="start">Different wall planes at f=3 and f=6</text>
<text x="840" y="461" class="small" text-anchor="start">A defender can hold or escape</text>
<text x="840" y="491" class="small" text-anchor="start">Ghosts never seal the route</text>
<text x="840" y="521" class="small" text-anchor="start">Own/enemy editing differs</text>
