<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="620" viewBox="0 0 1360 620" role="img" aria-labelledby="title desc">
  <title id="title">Team practice map — shared arena configurations</title>
  <desc id="desc">Three alternative 16 by 16 tile configurations of one shared arena: Skirmish, Capture the Flag, and Zone Wars. Only one configuration is active at a time.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#314258" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#f2c14e"/></marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#e9f0fa}.title{font-size:24px;font-weight:700}.sub{font-size:14px;fill:#9fb0c4}.mode{font-size:18px;font-weight:700}.label{font-size:13px}.small{font-size:11px;fill:#b8c5d6}.dim{font-size:12px;fill:#f2c14e;font-weight:600}
    </style>
  </defs>
  <rect width="1360" height="620" fill="#0b1220"/>
  <text x="36" y="42" class="title">TEAM PRACTICE · SHARED ARENA CONFIGURATIONS</text>
  <text x="36" y="67" class="sub">One 16 × 16 clear floor · 81.92 × 81.92 m · one tile = 5.12 m · select one mode before each match</text>

  <!-- Common arena geometry: 16x16 tiles shown at 20 px/tile. -->
  <g transform="translate(44 112)">
    <text x="0" y="-18" class="mode">SKIRMISH · CONFIG A</text><text x="0" y="-2" class="small">Neutral control · 2v2 → 4v4</text>
    <rect width="320" height="320" rx="4" fill="#111d2c" stroke="#6f829a" stroke-width="2"/>
    <rect width="320" height="320" fill="url(#grid)"/>
    <rect x="15" y="120" width="42" height="80" rx="5" fill="#243f57" stroke="#65a7ff" stroke-width="2"/>
    <text x="36" y="164" text-anchor="middle" class="small">BLUE</text>
    <rect x="263" y="120" width="42" height="80" rx="5" fill="#542b3a" stroke="#ff7777" stroke-width="2"/>
    <text x="284" y="164" text-anchor="middle" class="small">RED</text>
    <path d="M57 160H262" stroke="#f2c14e" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M57 130C120 70 200 70 263 130" fill="none" stroke="#73d6b0" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M57 190C120 250 200 250 263 190" fill="none" stroke="#a98bff" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="160" cy="160" r="29" fill="#9c7a25" fill-opacity=".5" stroke="#f2c14e" stroke-width="3"/>
    <text x="160" y="157" text-anchor="middle" class="label">CAPTURE</text><text x="160" y="174" text-anchor="middle" class="small">ZONE</text>
    <rect x="139" y="95" width="42" height="18" rx="3" fill="#31475b"/><text x="160" y="108" text-anchor="middle" class="small">HEIGHT</text>
    <path d="M0 334H320" stroke="#f2c14e"/><text x="160" y="354" text-anchor="middle" class="dim">16 tiles / 81.92 m</text>
  </g>

  <g transform="translate(520 112)">
    <text x="0" y="-18" class="mode">CAPTURE THE FLAG · CONFIG B</text><text x="0" y="-2" class="small">Return your flag · score only while it is home</text>
    <rect width="320" height="320" rx="4" fill="#111d2c" stroke="#6f829a" stroke-width="2"/>
    <rect width="320" height="320" fill="url(#grid)"/>
    <rect x="12" y="111" width="52" height="98" rx="5" fill="#1c3651" stroke="#65a7ff" stroke-width="2"/>
    <text x="38" y="155" text-anchor="middle" class="small">BLUE</text><text x="38" y="174" text-anchor="middle" class="small">BASE</text>
    <path d="M38 132V103M38 104L54 111L38 118" fill="none" stroke="#65a7ff" stroke-width="3"/>
    <rect x="256" y="111" width="52" height="98" rx="5" fill="#4b2632" stroke="#ff7777" stroke-width="2"/>
    <text x="282" y="155" text-anchor="middle" class="small">RED</text><text x="282" y="174" text-anchor="middle" class="small">BASE</text>
    <path d="M282 132V103M282 104L298 111L282 118" fill="none" stroke="#ff7777" stroke-width="3"/>
    <path d="M64 160H255" stroke="#f2c14e" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M64 130C120 75 200 75 256 130" fill="none" stroke="#73d6b0" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M64 190C120 245 200 245 256 190" fill="none" stroke="#a98bff" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="145" y="130" width="30" height="60" rx="4" fill="#263445" stroke="#e9f0fa" stroke-dasharray="4 3"/>
    <text x="160" y="157" text-anchor="middle" class="small">MID</text><text x="160" y="174" text-anchor="middle" class="small">FIGHT</text>
    <path d="M0 334H320" stroke="#f2c14e"/><text x="160" y="354" text-anchor="middle" class="dim">16 tiles / 81.92 m</text>
  </g>

  <g transform="translate(996 112)">
    <text x="0" y="-18" class="mode">ZONE WARS · CONFIG C</text><text x="0" y="-2" class="small">End-game rotations · 6 authored storm phases</text>
    <rect width="320" height="320" rx="4" fill="#111d2c" stroke="#6f829a" stroke-width="2"/>
    <rect width="320" height="320" fill="url(#grid)"/>
    <rect x="40" y="40" width="240" height="240" fill="#153647" fill-opacity=".45" stroke="#73d6b0" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="48" y="58" class="small">12×12 PLAYABLE CORE</text>
    <path d="M58 256L115 214L146 236M242 68L205 117L232 151M83 82L118 125M261 239L214 202" fill="none" stroke="#f2c14e" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M92 175L118 148L144 177L171 147L198 177L224 150" fill="none" stroke="#a98bff" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="160" cy="160" r="92" fill="none" stroke="#65a7ff" stroke-width="2" stroke-dasharray="5 5"/>
    <circle cx="160" cy="160" r="45" fill="none" stroke="#ff7777" stroke-width="2" stroke-dasharray="5 5"/>
    <circle cx="160" cy="160" r="8" fill="#f2c14e"/><text x="160" y="197" text-anchor="middle" class="small">FINAL BEACON</text>
    <path d="M0 334H320" stroke="#f2c14e"/><text x="160" y="354" text-anchor="middle" class="dim">16 tiles / 81.92 m frame</text>
  </g>

  <g transform="translate(44 520)">
    <path d="M0 0H70" stroke="#f2c14e" stroke-width="4" marker-end="url(#arrow)"/><text x="82" y="5" class="label">Direct centre route</text>
    <path d="M265 0H335" stroke="#73d6b0" stroke-width="3" marker-end="url(#arrow)"/><text x="347" y="5" class="label">Covered upper flank</text>
    <path d="M557 0H627" stroke="#a98bff" stroke-width="3" marker-end="url(#arrow)"/><text x="639" y="5" class="label">Buildable lower flank</text>
    <text x="0" y="42" class="small">These are alternate setups for the same floor: one mode token, one objective set, one score/reset owner at a time.</text>
    <text x="0" y="62" class="small">Proposed geometry only; confirm footprint, sightlines, build collision and route parity in UEFN before placement or balance claims.</text>
  </g>
</svg>
